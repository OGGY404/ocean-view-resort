# GitHub Actions CI/CD Workflow — Task D
# This file automates: build → test → on every push to GitHub
#
# What is CI/CD?
# CI = Continuous Integration: automatically build and test when code is pushed
# CD = Continuous Deployment: automatically deploy after tests pass
#
# What the lecturer might ask: "What is the purpose of your workflow?"
# Answer: Every time code is pushed to GitHub, this workflow:
# 1. Checks out the code
# 2. Builds the Spring Boot backend
# 3. Runs all JUnit tests
# 4. Reports pass/fail

name: Ocean View Resort CI

on:
  push:
    branches: [ main, develop ]   # Runs on push to main or develop branch
  pull_request:
    branches: [ main ]             # Runs on pull requests to main

jobs:
  # ========== Backend Build & Test ==========
  backend:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Run JUnit Tests
        working-directory: ./backend
        run: mvn test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ========== Frontend Build ==========
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
